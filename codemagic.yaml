# Cloud-Build für iOS (App Store / TestFlight) – Einrichtung: CODEMAGIC.md
# Startet nur manuell (keine automatischen Trigger konfiguriert).
workflows:
  ios-release:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name des App-Store-Connect-API-Keys in Codemagic (Team → Integrations)
      app_store_connect: calmdrop-asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.juliawimmer.calmdrop
    scripts:
      - name: Signing-Profile ins Xcode-Projekt übernehmen
        script: xcode-project use-profiles
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Analyse und Tests
        script: flutter analyze && flutter test
      - name: IPA bauen
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android → AAB (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      android_signing:
        # Name des Keystores in Codemagic (Team → Code signing identities → Android)
        - calmdrop_upload
    scripts:
      - name: key.properties aus Codemagic-Keystore erzeugen
        script: |
          cat > android/key.properties <<KEYEOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          KEYEOF
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Analyse und Tests
        script: flutter analyze && flutter test
      - name: AAB bauen
        script: flutter build appbundle --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  plutokrat-screenshots:
    name: Croesus → Simulator-Screenshots
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: Plutokrat
    environment:
      xcode: latest
    scripts:
      - name: Projekt erzeugen
        script: |
          brew install xcodegen
          xcodegen
      - name: Simulator wählen (größtes iPhone = 6,9"-Screenshots)
        script: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone .* Pro Max" | tail -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "UDID=$UDID" >> $CM_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
      - name: Bauen (Simulator, ohne Signing)
        script: |
          xcodebuild -project Plutokrat.xcodeproj -scheme Plutokrat \
            -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | tail -40
          test ${PIPESTATUS[0]} -eq 0
      - name: Screenshots aufnehmen
        script: |
          APP=build/Build/Products/Debug-iphonesimulator/Plutokrat.app
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          shot() { # Sprache, Name, Launch-Argumente...
            local lang=$1 n=$2; shift 2
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BID" -AppleLanguages "($lang)" -AppleLocale "${lang}_$( [ $lang = de ] && echo DE || echo US )" "$@"
            sleep 4
            xcrun simctl io "$UDID" screenshot "screenshots/${lang}_$n.png"
          }
          for lang in en de; do
            shot $lang 01_start -name ""
            shot $lang 02_menu -name Maximilian
            for s in certificate ticker champagne butler boarding calls peasant; do
              shot $lang "03_$s" -name Maximilian -startScreen $s
            done
          done
    artifacts:
      - Plutokrat/screenshots/*.png
      - Plutokrat/build.log

  plutokrat-release:
    name: Croesus → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    working_directory: Plutokrat
    integrations:
      app_store_connect: calmdrop-asc
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.juliawimmer.croesus
    scripts:
      - name: Projekt erzeugen
        script: |
          brew install xcodegen
          xcodegen
      - name: Signing-Profile übernehmen
        script: xcode-project use-profiles
      - name: IPA bauen
        script: |
          xcode-project build-ipa \
            --project Plutokrat.xcodeproj --scheme Plutokrat \
            --archive-flags="CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - Plutokrat/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
