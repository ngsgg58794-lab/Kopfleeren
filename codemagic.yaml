# Cloud-Build für iOS (App Store / TestFlight) – Einrichtung: CODEMAGIC.md
# Startet nur manuell (keine automatischen Trigger konfiguriert).
workflows:
  ios-release:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name des App-Store-Connect-API-Keys in Codemagic (Team → Integrations)
      app_store_connect: calmdrop-asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.juliawimmer.calmdrop
    scripts:
      - name: Signing-Profile ins Xcode-Projekt übernehmen
        script: xcode-project use-profiles
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Analyse und Tests
        script: flutter analyze && flutter test
      - name: IPA bauen
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android → AAB (Play Store)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      android_signing:
        # Name des Keystores in Codemagic (Team → Code signing identities → Android)
        - calmdrop_upload
    scripts:
      - name: key.properties aus Codemagic-Keystore erzeugen
        script: |
          cat > android/key.properties <<KEYEOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          KEYEOF
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Analyse und Tests
        script: flutter analyze && flutter test
      - name: AAB bauen
        script: flutter build appbundle --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
